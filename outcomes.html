<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>함께 바꿨습니다. | 영광군의회 열린소통</title>
  <meta name="description" content="영광군민의 목소리와 의회의 소통이 만들어낸 의정활동 성과 및 변화 과정 확인">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-area" aria-label="영광군의회 열린소통 메인으로 이동">
        <div class="brand-symbol">ON</div>
        <div class="brand-titles">
          <span class="brand-title">영광군의회 열린소통</span>
          <span class="brand-sub">군민과 의회가 함께 만드는 영광</span>
        </div>
      </a>
      
      <div class="header-actions">
        <button id="btn-kakao" class="btn-kakao-login" aria-label="카카오로 시작하기">
          <svg viewBox="0 0 24 24">
            <path d="M12 3C6.477 3 2 6.477 2 10.765c0 2.766 1.832 5.19 4.606 6.556-.2.744-.727 2.693-.833 3.109-.13.513.189.507.397.369.164-.109 2.607-1.77 3.654-2.482.71.103 1.44.158 2.176.158 5.523 0 10-3.477 10-7.765C22 6.477 17.523 3 12 3z"/>
          </svg>
          <span>카카오로 시작하기</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Subpage Banner Header (Navy/Dark Blue Theme) -->
  <section class="subpage-banner outcome-banner">
    <div class="subpage-banner-container">
      <div class="subpage-title-badge">
        <span>🤝 묻고, 듣고, 함께 바꿉니다</span>
        <span class="demo-tag-pill" style="background: rgba(255,255,255,0.2); color: white;">시연용</span>
      </div>
      <h1 class="subpage-main-title">함께 바꿨습니다.</h1>
      <p class="subpage-main-desc">군민의 목소리가 어떻게 의정활동과 영광의 변화로 이어졌는지 확인해 보세요.</p>
    </div>
  </section>

  <!-- Main Content Area -->
  <main class="content-area" style="gap: 32px; padding-top: 36px;">
    
    <!-- Filter Pills -->
    <div class="filter-pills" id="outcome-filter-pills" style="margin-bottom: 0;">
      <button class="pill-btn active" data-type="전체">전체 성과</button>
      <button class="pill-btn" data-type="listen-to-ask">🔥 공론화 연결</button>
      <button class="pill-btn" data-type="listen">💬 군민 제안에서 시작</button>
      <button class="pill-btn" data-type="ask">🙋‍♂️ 의회 의견수렴에서 시작</button>
    </div>

    <!-- Active Filter Display Bar & Notice -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--navy); padding-bottom: 12px; flex-wrap: wrap; gap: 8px;">
      <div style="font-size: 0.9375rem; color: var(--navy); font-weight: 700;">
        <span>총 <strong id="outcome-result-count" style="color: var(--blue);">0</strong>건의 의정 성과가 있습니다.</span>
      </div>
      <span class="demo-tag-pill">※ 본 페이지 데이터는 서비스 시연을 위한 예시입니다.</span>
    </div>

    <!-- Dynamic Outcome Cards Grid -->
    <div id="outcomes-grid-container" class="cards-grid">
      <!-- Injected via main.js -->
    </div>

    <!-- Empty State -->
    <div id="outcomes-empty-state" style="display: none; text-align: center; padding: 60px 20px; background: white; border-radius: var(--radius-md); border: 1px dashed var(--border-strong);">
      <p style="font-size: 1.25rem; font-weight: 700; color: var(--navy); margin-bottom: 8px;">선택한 필터의 성과 데이터가 없습니다.</p>
      <p style="font-size: 0.9375rem; color: var(--text-sub);">다른 필터를 선택해 보세요.</p>
    </div>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-brand">
        <b>영광군의회 열린소통</b>
        <span>묻고, 듣고, 함께 바꿉니다. (우 57036 전라남도 영광군 영광읍 중앙로 179)</span>
      </div>
      <div class="footer-nav">
        <a href="#">이용안내</a>
        <span>·</span>
        <a href="#">개인정보처리방침</a>
        <span>·</span>
        <a href="admin.html" class="footer-admin-link">관리자</a>
      </div>
    </div>
  </footer>

  <!-- Unified Modal Window -->
  <div id="modal" class="modal-backdrop">
    <div class="modal-window">
      <button id="btn-modal-close" class="btn-modal-close" aria-label="닫기">×</button>
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">안내</h3>
      </div>
      <p id="modal-desc" class="modal-desc"></p>
      
      <div id="modal-actions" class="modal-actions" style="display: none;">
        <button id="btn-share-kakao" class="btn-share-option btn-share-kakao">
          <span>🟡 카카오톡</span>
        </button>
        <button id="btn-share-fb" class="btn-share-option btn-share-fb">
          <span>🟦 페이스북</span>
        </button>
        <button id="btn-share-copy" class="btn-share-option btn-share-copy">
          <span>🔗 링크 복사</span>
        </button>
      </div>
    </div>
  </div>

  <script src="ask-data.js"></script>
  <script src="listen-data.js"></script>
  <script src="outcome-data.js"></script>
  <script src="main.js"></script>
</body>
</html>
